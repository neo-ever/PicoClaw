[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picoclaw"
version = "0.1.0"
description = "A small, safe, extensible coding-agent runtime built for learning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "neo-ever" }]
keywords = ["coding-agent", "agent-runtime", "mcp", "llm", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.1.1,<3",
    "openai>=3.6.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
qwen = [
    "accelerate>=1.2,<2",
    "numpy>=2,<3",
    "torch>=2.6,<3",
    "transformers>=5.17,<6",
]

[project.urls]
Homepage = "https://github.com/neo-ever/PicoClaw"
Repository = "https://github.com/neo-ever/PicoClaw.git"
Issues = "https://github.com/neo-ever/PicoClaw/issues"

[project.scripts]
picoclaw-demo = "picoclaw.demo:main"
picoclaw-m3-demo = "picoclaw.m3_demo:main"
picoclaw-m4-demo = "picoclaw.m4_demo:main"
picoclaw-m5-demo = "picoclaw.m5_demo:main"
picoclaw-m6-demo = "picoclaw.m6_demo:main"
picoclaw-m7-demo = "picoclaw.m7_demo:main"
picoclaw-m7b-demo = "picoclaw.m7b_demo:main"
picoclaw-m7c-demo = "picoclaw.m7c_demo:main"
picoclaw-qwen-delta-train = "picoclaw.qwen_delta_train:main"
picoclaw-qwen-delta-serve = "picoclaw.qwen_delta_service:main"
picoclaw-qwen-preflight = "picoclaw.qwen_preflight:main"
picoclaw-real = "picoclaw.real_demo:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
